services:
  - type: web
    runtime: node
    name: app
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Auto-generated so the app boots in production (SESSION_SECRET is required there).
      - key: SESSION_SECRET
        generateValue: true
      # DATABASE_URL must be provided (e.g. linked Postgres / Neon). Required at
      # build time too, since `npm run migrate` runs on deploy.
      # - key: DATABASE_URL
      #   fromDatabase: { name: bildup-db, property: connectionString }
